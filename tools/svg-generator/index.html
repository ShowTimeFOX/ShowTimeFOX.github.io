<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generator Patternów i Tła SVG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: Inter, system-ui, sans-serif;
      }
      .checker {
        background: #0f172a
          conic-gradient(
            #1e293b 25%,
            transparent 0 50%,
            #1e293b 0 75%,
            transparent 0
          )
          0 0/16px 16px;
      }
      .seg {
        padding: 0.25rem 0.75rem;
        font-size: 0.75rem;
        font-weight: 500;
        border-radius: 0.375rem;
        color: #94a3b8;
        border: 1px solid transparent;
      }
      .seg:hover {
        color: #e2e8f0;
      }
      .seg[aria-pressed="true"] {
        background: #4f46e5;
        color: #fff;
      }
      .mode {
        padding: 0.375rem 0.5rem;
        font-size: 0.75rem;
        font-weight: 500;
        border-radius: 0.5rem;
        border: 1px solid #334155;
        background: #1e293b;
        color: #cbd5e1;
      }
      .mode:hover {
        background: #334155;
      }
      .mode[aria-pressed="true"] {
        background: #4f46e5;
        border-color: #6366f1;
        color: #fff;
      }
      .tab {
        padding: 0.25rem 0.75rem;
        font-size: 0.75rem;
        color: #94a3b8;
        border-bottom: 2px solid transparent;
      }
      .tab[aria-pressed="true"] {
        color: #818cf8;
        border-color: #6366f1;
        font-weight: 600;
      }
      input[type="range"] {
        width: 100%;
        height: 0.375rem;
        accent-color: #6366f1;
        cursor: pointer;
      }
      #toast {
        transition: all 0.3s;
      }
      .cf-sw {
        width: 1.75rem;
        height: 1.75rem;
        flex: none;
        border-radius: 0.5rem;
        border: 1px solid rgba(255, 255, 255, 0.25);
        cursor: pointer;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.3);
      }
      .cf-sw:hover {
        border-color: #818cf8;
      }
      .cf-hex {
        width: 5.75rem;
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 0.5rem;
        padding: 0.25rem 0.5rem;
        font:
          500 0.75rem ui-monospace,
          monospace;
        color: #e2e8f0;
      }
      .cf-hex:focus {
        outline: 0;
        border-color: #6366f1;
      }
      .cf-hex[aria-invalid] {
        border-color: #ef4444;
      }
      #pop {
        position: fixed;
        z-index: 60;
        width: 232px;
        padding: 12px;
        background: #0b1220;
        border: 1px solid #334155;
        border-radius: 14px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      }
      #pop .sv {
        position: relative;
        height: 150px;
        border-radius: 8px;
        cursor: crosshair;
        touch-action: none;
        background:
          linear-gradient(to top, #000, transparent),
          linear-gradient(to right, #fff, hsl(var(--h, 0) 100% 50%));
      }
      #pop .sv i {
        position: absolute;
        width: 14px;
        height: 14px;
        margin: -7px 0 0 -7px;
        border-radius: 50%;
        border: 2px solid #fff;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5);
        pointer-events: none;
      }
      input[type="range"].hue {
        height: 12px;
        margin-top: 12px;
        border-radius: 6px;
        -webkit-appearance: none;
        appearance: none;
        background: linear-gradient(
          to right,
          #f00,
          #ff0,
          #0f0,
          #0ff,
          #00f,
          #f0f,
          #f00
        );
      }
      input[type="range"].hue::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        border: 2px solid #0f172a;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.6);
      }
      input[type="range"].hue::-moz-range-thumb {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #fff;
        border: 2px solid #0f172a;
      }
      #pop .pw {
        width: 20px;
        height: 20px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        cursor: pointer;
      }
      #pop .pw:hover {
        transform: scale(1.15);
      }
    </style>
  </head>
  <body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">
    <header
      class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50"
    >
      <div
        class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3"
      >
        <div>
          <h1
            class="font-bold text-lg leading-tight bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent"
          >
            SVG Pattern Studio
          </h1>
          <p class="text-xs text-slate-400">
            Generator powtarzalnych teł i wzorów z plików SVG
          </p>
        </div>
        <div class="flex items-center gap-2">
          <button
            data-act="samples"
            class="px-3 py-1.5 text-xs font-medium bg-slate-800 hover:bg-slate-700 rounded-md border border-slate-700"
          >
            Przykładowe SVG
          </button>
          <button
            data-act="rand"
            class="px-4 py-1.5 text-xs font-semibold bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 rounded-md shadow-md active:scale-95"
          >
            🎲 Randomizuj wzór
          </button>
        </div>
      </div>
    </header>

    <main class="flex-1 grid grid-cols-1 lg:grid-cols-12">
      <section
        id="left"
        class="lg:col-span-5 border-r border-slate-800 p-4 overflow-y-auto lg:max-h-[calc(100vh-61px)] flex flex-col gap-4"
      >
        <div
          class="bg-slate-950/60 p-3.5 rounded-xl border border-slate-800 space-y-3"
        >
          <div class="flex justify-between items-center">
            <h2
              class="text-xs font-bold uppercase tracking-wider text-indigo-400"
            >
              1. Biblioteka SVG
            </h2>
            <span
              id="svg-count"
              class="text-[10px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full font-mono"
            ></span>
          </div>
          <div
            id="drop-zone"
            class="border-2 border-dashed border-slate-700 hover:border-indigo-500 bg-slate-900/50 p-4 rounded-lg text-center cursor-pointer transition-colors"
          >
            <p class="text-xs text-slate-300 font-medium">
              Upuść pliki .svg lub kliknij, aby wybrać
            </p>
            <p class="text-[10px] text-slate-500 mt-0.5">
              Możesz wczytać wiele plików jednocześnie
            </p>
            <input
              type="file"
              id="file-input"
              multiple
              accept=".svg"
              class="hidden"
            />
          </div>
          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="text-[11px] text-slate-400" for="paste"
                >Lub wklej kod &lt;svg&gt;:</label
              >
              <button
                data-act="paste"
                class="text-[10px] bg-indigo-600 hover:bg-indigo-500 px-2 py-0.5 rounded"
              >
                Dodaj z pola
              </button>
            </div>
            <textarea
              id="paste"
              rows="2"
              class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs font-mono text-slate-300 focus:outline-none focus:border-indigo-500 resize-none"
              placeholder="<svg>...</svg>"
            ></textarea>
          </div>
          <div
            id="library"
            class="flex flex-wrap gap-2 pt-2 border-t border-slate-800/80 max-h-36 overflow-y-auto"
          ></div>
        </div>

        <div
          class="bg-slate-950/60 p-3.5 rounded-xl border border-slate-800 space-y-3"
        >
          <h2
            class="text-xs font-bold uppercase tracking-wider text-indigo-400"
          >
            2. Układ i Wymiary Tła
          </h2>
          <div class="grid grid-cols-3 gap-2">
            <button class="mode" data-mode="grid">Siatka</button>
            <button class="mode" data-mode="stagger">Hex / Stagger</button>
            <button class="mode" data-mode="random">Scatter (Losowy)</button>
          </div>
          <div id="s-layout" class="grid grid-cols-2 gap-3"></div>
          <div class="space-y-2.5 text-xs text-slate-400">
            <div class="flex items-center gap-2">
              <span>Tło</span>
              <div class="grid grid-cols-2 gap-1 w-44">
                <button class="mode" data-bgtype="solid">Normalne</button>
                <button class="mode" data-bgtype="gradient">Gradient</button>
              </div>
              <label class="ml-auto flex items-center gap-1.5"
                ><input type="checkbox" data-k="bgTransparent" />
                Przezroczyste</label
              >
            </div>
            <div id="bg-solid">
              <div data-cf="bgColor" class="flex items-center gap-2"></div>
            </div>
            <div id="bg-grad" class="space-y-2.5">
              <div id="stops" class="space-y-2"></div>
              <div id="s-bg"></div>
            </div>
          </div>
        </div>

        <div
          class="bg-slate-950/60 p-3.5 rounded-xl border border-slate-800 space-y-3"
        >
          <div class="flex justify-between items-center">
            <h2
              class="text-xs font-bold uppercase tracking-wider text-indigo-400"
            >
              3. Stylizowanie i Transformacje
            </h2>
            <button
              data-act="reset"
              class="text-[10px] text-slate-400 hover:text-slate-200 underline"
            >
              Resetuj parametry
            </button>
          </div>
          <div id="s-style" class="space-y-2.5"></div>
          <div
            class="flex items-center gap-2 text-xs text-slate-300 border-t border-slate-800/50 pt-2"
          >
            <label class="flex items-center gap-1.5"
              ><input type="checkbox" data-k="overrideColor" /> Nadpisz kolor
              ikon</label
            >
            <div
              data-cf="fillColor"
              class="ml-auto flex items-center gap-2"
            ></div>
          </div>
        </div>
      </section>

      <section
        class="lg:col-span-7 bg-slate-950 flex flex-col lg:h-[calc(100vh-61px)]"
      >
        <div
          class="bg-slate-900 border-b border-slate-800 px-4 py-2.5 flex justify-between items-center"
        >
          <div
            class="flex gap-1 bg-slate-950 p-1 rounded-lg border border-slate-800"
          >
            <button class="seg" data-view="full">Pełne Powtarzalne Tło</button>
            <button class="seg" data-view="tile">
              Pojedynczy Kafelek (Tile)
            </button>
          </div>
          <span class="text-xs text-slate-400">● Podgląd na żywo</span>
        </div>

        <div
          class="flex-1 min-h-64 relative overflow-hidden flex items-center justify-center p-4 checker"
        >
          <div
            id="preview"
            class="w-full h-full rounded-xl shadow-2xl border border-slate-700/50 flex items-center justify-center"
          ></div>
        </div>

        <div class="h-64 border-t border-slate-800 bg-slate-900 flex flex-col">
          <div
            class="px-4 py-2 border-b border-slate-800 flex justify-between items-center bg-slate-950/40"
          >
            <div class="flex gap-2 items-center">
              <button class="tab" data-tab="css">Kod CSS</button>
              <button class="tab" data-tab="svg">Czysty SVG Kafelka</button>
              <span
                id="size"
                class="text-[10px] text-slate-500 font-mono"
              ></span>
            </div>
            <div class="flex gap-2">
              <button
                data-act="dl"
                class="px-3 py-1 text-xs font-medium bg-slate-800 hover:bg-slate-700 rounded border border-slate-700"
              >
                Pobierz
              </button>
              <button
                data-act="copy"
                class="px-3.5 py-1 text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 rounded shadow"
              >
                Kopiuj Kod
              </button>
            </div>
          </div>
          <div class="flex-1 p-3">
            <textarea
              id="out"
              readonly
              class="w-full h-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs font-mono text-emerald-400 focus:outline-none resize-none"
            ></textarea>
          </div>
        </div>
      </section>
    </main>

    <div
      id="toast"
      class="fixed bottom-5 right-5 bg-emerald-600 px-4 py-2.5 rounded-lg shadow-xl text-xs font-medium translate-y-20 opacity-0 pointer-events-none z-50"
    ></div>

    <script>
      const $ = (s, r = document) => r.querySelector(s);
      const $$ = (s, r = document) => [...r.querySelectorAll(s)];
      const NS = "http://www.w3.org/2000/svg";
      const ICON_INK = "#a5b4fc"; // kolor currentColor, gdy nie nadpisujemy

      const SAMPLES = [
        `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`,
        `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg>`,
        `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`,
        `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>`,
      ];

      // [klucz, etykieta, min, max, krok, jednostka]
      const SLIDERS = {
        layout: [
          ["tileW", "Szerokość kafelka", 60, 800, 10, "px"],
          ["tileH", "Wysokość kafelka", 60, 800, 10, "px"],
          ["density", "Gęstość (liczba elem.)", 1, 40, 1, ""],
        ],
        bg: [["bgAngle", "Kąt gradientu", 0, 360, 1, "°"]],
        style: [
          ["baseSize", "Rozmiar bazowy ikony", 8, 120, 1, "px"],
          ["randomScale", "Losowa wariacja rozmiaru", 0, 100, 1, "%"],
          ["baseRotate", "Bazowa rotacja", 0, 360, 1, "°"],
          ["randomRotate", "Losowy rozrzut kąta", 0, 360, 1, "°"],
          ["opacity", "Przezroczystość", 0.1, 1, 0.05, ""],
          ["randomOpacity", "Losowa wariacja opacity", 0, 100, 1, "%"],
          ["randomY", "Losowe przesunięcie w pionie", 0, 120, 1, "px"],
          ["hue", "Przesunięcie odcienia (Hue)", 0, 360, 1, "°"],
          ["blur", "Rozmycie (Blur)", 0, 10, 0.5, "px"],
        ],
      };
      const UNITS = {};
      Object.values(SLIDERS)
        .flat()
        .forEach(([k, , , , , u]) => (UNITS[k] = u));

      const STYLE_DEFAULTS = {
        baseSize: 32,
        randomScale: 40,
        baseRotate: 0,
        randomRotate: 180,
        opacity: 0.85,
        randomOpacity: 30,
        randomY: 0,
        hue: 0,
        blur: 0,
        overrideColor: false,
      };
      const state = {
        layoutMode: "stagger",
        tileW: 240,
        tileH: 240,
        density: 12,
        bgColor: "#0f172a",
        stops: [
          { c: "#0f172a", p: 0 },
          { c: "#4f46e5", p: 100 },
        ],
        bgAngle: 135,
        bgType: "solid",
        bgTransparent: false,
        fillColor: "#818cf8",
        seed: 12345,
        view: "full",
        tab: "css",
        ...STYLE_DEFAULTS,
      };
      let lib = []; // { vb, a, c } – sparsowane raz, przy dodaniu ikony

      /* ---------- Biblioteka ---------- */
      function parseIcon(src) {
        if (!/xmlns=/.test(src))
          src = src.replace(/<svg/i, `<svg xmlns="${NS}"`);
        const doc = new DOMParser().parseFromString(src, "image/svg+xml");
        const root = doc.documentElement;
        if (doc.querySelector("parsererror") || root.localName !== "svg")
          return null;
        $$("script,foreignObject", doc).forEach((n) => n.remove());
        $$("*", doc).forEach((n) =>
          [...n.attributes].forEach(
            (at) => /^on/i.test(at.name) && n.removeAttribute(at.name),
          ),
        );

        const vb =
          root.getAttribute("viewBox") ||
          `0 0 ${parseFloat(root.getAttribute("width")) || 24} ${parseFloat(root.getAttribute("height")) || 24}`;
        const skip = /^(xmlns|width|height|viewBox|class|id|version|x|y)/;
        const a = [...root.attributes]
          .filter((at) => !skip.test(at.name))
          .map((at) => `${at.name}='${at.value.replace(/'/g, "&apos;")}'`)
          .join(" ");
        const c = root.innerHTML
          .replace(/<!--[\s\S]*?-->/g, "")
          .replace(/ xmlns(:\w+)?=("[^"]*"|'[^']*')/g, "")
          .replace(/\s+/g, " ")
          .replace(/> </g, "><")
          .trim();
        return { vb, a, c };
      }

      function addSvg(src) {
        const icon = parseIcon(src);
        if (icon) lib.push(icon);
        return !!icon;
      }

      /* ---------- Generowanie SVG ---------- */
      const mulberry32 = (a) => () => {
        a = (a + 0x6d2b79f5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
      const num = (n, d = 0) => +n.toFixed(d);
      const sortedStops = () => [...state.stops].sort((a, b) => a.p - b.p);
      const stopsSvg = () =>
        sortedStops()
          .map(
            (x) =>
              `<stop${x.p ? ` offset='${x.p / 100}'` : ""} stop-color='${x.c}'/>`,
          )
          .join("");
      const stopsCss = () => {
        // pozycje pomijamy, gdy kolory są rozłożone równomiernie
        const s = sortedStops(),
          n = s.length;
        const even = s.every((x, i) => x.p === Math.round((i * 100) / (n - 1)));
        return s.map((x) => (even ? x.c : `${x.c} ${x.p}%`)).join(",");
      };
      const quote = (s) => (s.includes("'") ? s : s.replace(/"/g, "'"));
      const recolor = (s) =>
        s.replace(
          /(fill|stroke)=(["'])(?!none|currentColor)[^"']*\2/g,
          "$1=$2currentColor$2",
        );

      // ikona -> atrybuty i zawartość, z ewentualnym nadpisaniem koloru
      function ink({ a, c }) {
        if (state.overrideColor) {
          a = recolor(a);
          c = recolor(c);
          if (!/fill=/.test(a)) a += " fill='currentColor'";
        }
        return [a, quote(c)];
      }

      function positions(rnd) {
        const { tileW: w, tileH: h, density: n, layoutMode: mode } = state;
        const p = [];
        if (mode === "random") {
          for (let i = 0; i < n; i++) p.push([rnd() * w, rnd() * h]);
          return p;
        }
        const cols = Math.ceil(Math.sqrt(n)),
          rows = Math.ceil(n / cols);
        const sx = w / cols,
          sy = h / rows;
        for (let r = 0; r < rows; r++)
          for (let c = 0; c < cols; c++)
            p.push([
              ((c + 0.5) * sx + (mode === "stagger" && r % 2 ? sx / 2 : 0)) % w,
              (r + 0.5) * sy,
            ]);
        return p;
      }

      // Każda użyta ikona jest definiowana RAZ (<symbol>), a instancje to krótkie <use>.
      function buildTile(withBg) {
        const { tileW: w, tileH: h } = state;
        if (!lib.length)
          return `<svg xmlns='${NS}' width='${w}' height='${h}'><text x='50%' y='50%' fill='#64748b' font-size='12' text-anchor='middle'>Brak SVG w bibliotece</text></svg>`;

        const rnd = mulberry32(state.seed);
        const used = new Set();
        let uses = "";
        positions(rnd).forEach(([x, y0], i) => {
          const y = (((y0 + (rnd() * 2 - 1) * state.randomY) % h) + h) % h; // zawijanie, żeby wzór dalej się powtarzał
          const k = i % lib.length;
          used.add(k);
          const s = Math.max(
            4,
            Math.round(
              state.baseSize *
                (1 + ((rnd() * 2 - 1) * state.randomScale) / 100),
            ),
          );
          const r = Math.round(
            state.baseRotate + (rnd() * 2 - 1) * state.randomRotate,
          );
          const o = num(
            Math.min(
              1,
              Math.max(
                0.05,
                state.opacity + ((rnd() * 2 - 1) * state.randomOpacity) / 100,
              ),
            ),
            2,
          );
          uses += `<use href='#${k.toString(36)}' x='${-s / 2}' y='${-s / 2}' width='${s}' height='${s}' transform='translate(${num(x)} ${num(y)})${r % 360 ? `rotate(${r})` : ""}'${o < 1 ? ` opacity='${o}'` : ""}/>`;
        });

        let defs = "";
        used.forEach((k) => {
          const [a, c] = ink(lib[k]);
          defs += `<symbol id='${k.toString(36)}' viewBox='${lib[k].vb}' ${a}>${c}</symbol>`;
        });

        const { hue, blur } = state;
        const filtered = hue > 0 || blur > 0;
        if (filtered)
          defs += `<filter id='f'>${hue > 0 ? `<feColorMatrix type='hueRotate' values='${hue}'/>` : ""}${blur > 0 ? `<feGaussianBlur stdDeviation='${blur}'/>` : ""}</filter>`;

        const color = state.overrideColor ? state.fillColor : ICON_INK;
        const grad = state.bgType === "gradient";
        if (withBg && grad && !state.bgTransparent) {
          const t = (state.bgAngle * Math.PI) / 180,
            sx = Math.sin(t) / 2,
            cy = Math.cos(t) / 2;
          defs += `<linearGradient id='g' x1='${num(0.5 - sx, 3)}' y1='${num(0.5 + cy, 3)}' x2='${num(0.5 + sx, 3)}' y2='${num(0.5 - cy, 3)}'>${stopsSvg()}</linearGradient>`;
        }
        const bg =
          withBg && !state.bgTransparent
            ? `<rect width='100%' height='100%' fill='${grad ? "url(#g)" : state.bgColor}'/>`
            : "";
        return `<svg xmlns='${NS}' width='${w}' height='${h}' viewBox='0 0 ${w} ${h}' color='${color}'><defs>${defs}</defs>${bg}${filtered ? `<g filter='url(#f)'>${uses}</g>` : uses}</svg>`;
      }

      // minimalne kodowanie data URI (tylko znaki, które naprawdę wymagają escapowania)
      const toUri = (svg) =>
        "data:image/svg+xml," +
        svg.replace(
          /[%#<>"]/g,
          (ch) => "%" + ch.charCodeAt(0).toString(16).toUpperCase(),
        );

      /* ---------- Render ---------- */
      let raf;
      const render = () => {
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(draw);
      };

      function draw() {
        const { tileW: w, tileH: h } = state;
        const prev = $("#preview");

        // tło jest w CSS: gradient rozciąga się na cały element, więc nie ma szwów między kafelkami
        const bgVal = () => {
          const tile = `url("${toUri(buildTile(false))}") 0 0/${w}px ${h}px`;
          if (state.bgTransparent) return tile;
          return state.bgType === "gradient"
            ? `${tile},linear-gradient(${state.bgAngle}deg,${stopsCss()})`
            : `${state.bgColor} ${tile}`;
        };

        if (state.view === "full") {
          prev.style.background = bgVal();
          prev.innerHTML = "";
        } else {
          prev.style.background = "none";
          prev.innerHTML = `<div class="border border-indigo-500/50 rounded-lg p-2 bg-slate-900/80 flex flex-col items-center">
      <div class="text-[10px] text-slate-400 mb-1 font-mono">${w}px × ${h}px Kafelek</div>
      <img alt="" src="${toUri(buildTile(true))}" class="border border-slate-700 rounded" style="width:${w}px;height:${h}px;max-width:360px;max-height:360px;object-fit:contain">
    </div>`;
        }

        const out = $("#out");
        out.value =
          state.tab === "css" ? `background:${bgVal()};` : buildTile(true);
        $("#size").textContent = `${new Blob([out.value]).size} B`;
        syncLabels();
      }

      function renderLibrary() {
        $("#svg-count").textContent = `${lib.length} elem.`;
        $("#library").innerHTML = lib
          .map((it, i) => {
            const [a, c] = ink({ a: it.a, c: it.c });
            const thumb = toUri(
              `<svg xmlns='${NS}' viewBox='${it.vb}' color='${ICON_INK}' ${a}>${c}</svg>`,
            );
            return `<div class="relative group w-10 h-10 bg-slate-900 border border-slate-700 rounded-lg p-1.5">
        <img alt="" src="${thumb}" class="w-full h-full">
        <button data-del="${i}" class="absolute -top-1.5 -right-1.5 bg-red-600 rounded-full w-4 h-4 text-[10px] opacity-0 group-hover:opacity-100">×</button></div>`;
          })
          .join("");
      }

      /* ---------- UI ---------- */
      function sliderHTML([k, label, min, max, step, unit]) {
        return `<label class="block"><div class="flex justify-between text-xs text-slate-400 mb-1"><span>${label}</span><span data-v="${k}" class="font-mono text-slate-200"></span></div>
    <input type="range" data-k="${k}" min="${min}" max="${max}" step="${step}"></label>`;
      }

      function syncLabels() {
        $$("[data-v]").forEach(
          (el) =>
            (el.textContent =
              state[el.dataset.v] + (UNITS[el.dataset.v] || "")),
        );
      }

      function syncUI() {
        $$("[data-k]").forEach((el) => {
          const v = state[el.dataset.k];
          el.type === "checkbox" ? (el.checked = v) : (el.value = v);
        });
        $$("[data-mode]").forEach((b) =>
          b.setAttribute("aria-pressed", b.dataset.mode === state.layoutMode),
        );
        $$("[data-bgtype]").forEach((b) =>
          b.setAttribute("aria-pressed", b.dataset.bgtype === state.bgType),
        );
        const g = state.bgType === "gradient";
        $("#bg-solid").classList.toggle("hidden", g);
        $("#bg-grad").classList.toggle("hidden", !g);
        $$("[data-cf]").forEach(cfRefresh);
        $$("[data-view]").forEach((b) =>
          b.setAttribute("aria-pressed", b.dataset.view === state.view),
        );
        $$("[data-tab]").forEach((b) =>
          b.setAttribute("aria-pressed", b.dataset.tab === state.tab),
        );
        syncLabels();
      }

      function toast(msg) {
        const t = $("#toast");
        t.textContent = msg;
        t.classList.remove("translate-y-20", "opacity-0");
        clearTimeout(toast.t);
        toast.t = setTimeout(
          () => t.classList.add("translate-y-20", "opacity-0"),
          2400,
        );
      }

      function download() {
        const css = state.tab === "css";
        const a = Object.assign(document.createElement("a"), {
          href: URL.createObjectURL(
            new Blob([$("#out").value], {
              type: css ? "text/css" : "image/svg+xml",
            }),
          ),
          download: css ? "pattern-background.css" : "pattern-tile.svg",
        });
        a.click();
        URL.revokeObjectURL(a.href);
        toast(`Pobrano plik: ${a.download}`);
      }

      async function copy() {
        const out = $("#out");
        try {
          await navigator.clipboard.writeText(out.value);
        } catch {
          out.select();
          document.execCommand("copy");
        }
        toast(
          state.tab === "css"
            ? "Skopiowano regułę CSS!"
            : "Skopiowano kod SVG!",
        );
      }

      const rand = (min, max) =>
        Math.floor(Math.random() * (max - min + 1)) + min;

      const ACTIONS = {
        samples() {
          lib = [];
          SAMPLES.forEach(addSvg);
          renderLibrary();
          toast("Przywrócono domyślne ikony SVG");
        },
        rand() {
          Object.assign(state, {
            seed: rand(0, 999999),
            baseSize: rand(16, 50),
            randomScale: rand(10, 70),
            baseRotate: rand(0, 360),
            randomRotate: rand(0, 360),
            randomY: rand(0, 60),
            opacity: num(0.5 + Math.random() * 0.45, 2),
            randomOpacity: rand(10, 50),
            density: rand(6, 24),
          });
          toast("Zrandomizowano cały wzór!");
        },
        reset() {
          Object.assign(state, STYLE_DEFAULTS);
          renderLibrary();
          toast("Zresetowano opcje stylizacji");
        },
        paste() {
          const ta = $("#paste");
          if (ta.value.includes("<svg") && addSvg(ta.value.trim())) {
            ta.value = "";
            renderLibrary();
            toast("Dodano SVG z pola tekstu!");
          } else toast("Błąd: Wklej poprawny kod <svg>");
        },
        addstop() {
          if (state.stops.length >= MAX_STOPS) return;
          const [h, sat, v] = hexToHsv(state.stops.at(-1).c);
          state.stops.push({
            c: hsvToHex((h + 50) % 360, sat || 0.6, v || 0.9),
            p: 100,
          });
          state.stops.forEach(
            (x, i, a) => (x.p = Math.round((i * 100) / (a.length - 1))),
          ); // równy rozkład
          renderStops();
        },
        copy,
        dl: download,
      };

      document.addEventListener("click", (e) => {
        const t = e.target.closest(
          "[data-act],[data-mode],[data-bgtype],[data-view],[data-tab],[data-del],[data-sdel]",
        );
        if (!t) return;
        const d = t.dataset;
        if (d.act) ACTIONS[d.act]();
        else if (d.mode) state.layoutMode = d.mode;
        else if (d.bgtype) state.bgType = d.bgtype;
        else if (d.view) state.view = d.view;
        else if (d.tab) state.tab = d.tab;
        else if (d.sdel) {
          if (state.stops.length > 2) state.stops.splice(+d.sdel, 1);
          renderStops();
        } else if (d.del) {
          lib.splice(+d.del, 1);
          renderLibrary();
        }
        syncUI();
        render();
      });

      $("#left").addEventListener("input", (e) => {
        const t = e.target,
          k = t.dataset.k;
        if (t.classList.contains("cf-hex")) return hexTyped(t);
        if (t.dataset.sp !== undefined) {
          state.stops[+t.dataset.sp].p = +t.value;
          t.nextElementSibling.textContent = t.value + "%";
          return render();
        }
        if (!k) return;
        state[k] =
          t.type === "checkbox"
            ? t.checked
            : t.type === "range"
              ? +t.value
              : t.value;
        if (k === "overrideColor") renderLibrary();
        syncLabels();
        render();
      });

      // wczytywanie plików
      const dz = $("#drop-zone"),
        fi = $("#file-input");
      dz.onclick = () => fi.click();
      dz.ondragover = (e) => {
        e.preventDefault();
        dz.classList.add("border-indigo-500");
      };
      dz.ondragleave = () => dz.classList.remove("border-indigo-500");
      dz.ondrop = (e) => {
        e.preventDefault();
        dz.ondragleave();
        loadFiles(e.dataTransfer.files);
      };
      fi.onchange = (e) => {
        loadFiles(e.target.files);
        fi.value = "";
      };

      async function loadFiles(files) {
        for (const f of files)
          if (f.type === "image/svg+xml" || /\.svg$/i.test(f.name))
            addSvg(await f.text());
        renderLibrary();
        render();
      }

      /* ---------- Kolory: picker + HEX ---------- */
      const MAX_STOPS = 8;
      const PRESETS = [
        "#0f172a",
        "#1e293b",
        "#4f46e5",
        "#818cf8",
        "#ec4899",
        "#f43f5e",
        "#ff9e3b",
        "#facc15",
        "#22c55e",
        "#06b6d4",
        "#ffffff",
        "#000000",
      ];
      const clamp = (x) => Math.min(1, Math.max(0, x));
      const HEX = /^#?([0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})$/i;
      const normHex = (s) => {
        const m = HEX.exec(s.trim());
        if (!m) return null;
        let h = m[1].toLowerCase();
        if (h.length === 3) h = [...h].map((c) => c + c).join("");
        return "#" + h.slice(0, 6);
      };
      function hexToHsv(hex) {
        const n = parseInt(hex.slice(1), 16);
        const r = ((n >> 16) & 255) / 255,
          g = ((n >> 8) & 255) / 255,
          b = (n & 255) / 255;
        const mx = Math.max(r, g, b),
          d = mx - Math.min(r, g, b);
        let h = 0;
        if (d)
          h =
            60 *
            (mx === r
              ? ((g - b) / d + 6) % 6
              : mx === g
                ? (b - r) / d + 2
                : (r - g) / d + 4);
        return [h, mx ? d / mx : 0, mx];
      }
      function hsvToHex(h, s, v) {
        const f = (n) => {
          const k = (n + h / 60) % 6;
          return v - v * s * Math.max(0, Math.min(k, 4 - k, 1));
        };
        return (
          "#" +
          [f(5), f(3), f(1)]
            .map((x) =>
              Math.round(x * 255)
                .toString(16)
                .padStart(2, "0"),
            )
            .join("")
        );
      }

      // pole koloru: <div data-cf="bgColor"> albo data-cf="s:2" (przystanek gradientu nr 2)
      const stopOf = (el) =>
        el.dataset.cf.startsWith("s:")
          ? state.stops[+el.dataset.cf.slice(2)]
          : null;
      const cfGet = (el) => (stopOf(el) ? stopOf(el).c : state[el.dataset.cf]);
      const cfSet = (el, c) =>
        stopOf(el) ? (stopOf(el).c = c) : (state[el.dataset.cf] = c);
      function cfMount(el) {
        const c = cfGet(el);
        el.innerHTML = `<button type="button" class="cf-sw" style="background:${c}" aria-label="Wybierz kolor"></button><input class="cf-hex" value="${c}" spellcheck="false" maxlength="9" aria-label="Kolor HEX">`;
      }
      function cfRefresh(el) {
        const c = cfGet(el),
          i = $(".cf-hex", el);
        $(".cf-sw", el).style.background = c;
        if (document.activeElement !== i) {
          i.value = c;
          i.removeAttribute("aria-invalid");
        }
      }

      const pop = document.createElement("div");
      pop.id = "pop";
      pop.hidden = true;
      pop.innerHTML = `<div class="sv"><i></i></div>
  <input type="range" class="hue" min="0" max="360" aria-label="Odcień">
  <div class="flex gap-2 items-center mt-3">
    <input class="cf-hex flex-1" id="pop-hex" spellcheck="false" maxlength="9" aria-label="HEX">
    <button type="button" id="pop-eye" class="px-2 py-1 text-xs rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200">Pipeta</button>
  </div>
  <div class="flex flex-wrap gap-1.5 mt-3">${PRESETS.map((c) => `<button type="button" class="pw" data-c="${c}" style="background:${c}" aria-label="${c}"></button>`).join("")}</div>`;
      document.body.append(pop);

      let cur = null,
        hsv = [0, 0, 0];
      const sv = $(".sv", pop),
        hue = $(".hue", pop),
        popHex = $("#pop-hex");

      function paintPop() {
        sv.style.setProperty("--h", Math.round(hsv[0]));
        Object.assign($("i", sv).style, {
          left: hsv[1] * 100 + "%",
          top: (1 - hsv[2]) * 100 + "%",
        });
        hue.value = hsv[0];
      }
      function applyColor(c) {
        cfSet(cur, c);
        cfRefresh(cur);
        if (document.activeElement !== popHex) {
          popHex.value = c;
          popHex.removeAttribute("aria-invalid");
        }
        render();
      }
      function fromHex(c) {
        // c: poprawny #rrggbb
        const n = hexToHsv(c);
        if (n[1] === 0 || n[2] === 0) n[0] = hsv[0]; // szarość/czerń: zachowaj odcień
        hsv = n;
        applyColor(c);
        paintPop();
      }
      function openPop(el) {
        cur = el;
        hsv = hexToHsv(cfGet(el));
        popHex.value = cfGet(el);
        popHex.removeAttribute("aria-invalid");
        pop.hidden = false;
        const r = el.getBoundingClientRect(),
          pw = pop.offsetWidth,
          ph = pop.offsetHeight;
        pop.style.left =
          Math.max(8, Math.min(r.left, innerWidth - pw - 8)) + "px";
        pop.style.top =
          Math.max(
            8,
            r.bottom + 8 + ph > innerHeight ? r.top - ph - 8 : r.bottom + 8,
          ) + "px";
        paintPop();
      }
      const closePop = () => (pop.hidden = true);

      // wpisywanie / wklejanie HEX w polu przy próbce
      function hexTyped(input) {
        const c = normHex(input.value);
        if (!c) return input.setAttribute("aria-invalid", "true");
        input.removeAttribute("aria-invalid");
        const el = input.closest("[data-cf]");
        cfSet(el, c);
        $(".cf-sw", el).style.background = c;
        if (cur === el && !pop.hidden) {
          const n = hexToHsv(c);
          if (n[1] && n[2]) hsv = n;
          else hsv = [hsv[0], n[1], n[2]];
          paintPop();
          popHex.value = c;
        }
        render();
      }
      popHex.addEventListener("input", () => {
        const c = normHex(popHex.value);
        if (!c) return popHex.setAttribute("aria-invalid", "true");
        popHex.removeAttribute("aria-invalid");
        fromHex(c);
      });
      const svMove = (e) => {
        const r = sv.getBoundingClientRect();
        hsv[1] = clamp((e.clientX - r.left) / r.width);
        hsv[2] = 1 - clamp((e.clientY - r.top) / r.height);
        applyColor(hsvToHex(...hsv));
        paintPop();
      };
      sv.onpointerdown = (e) => {
        sv.setPointerCapture(e.pointerId);
        svMove(e);
        sv.onpointermove = svMove;
      };
      sv.onpointerup = () => (sv.onpointermove = null);
      hue.oninput = () => {
        hsv[0] = +hue.value;
        applyColor(hsvToHex(...hsv));
        paintPop();
      };
      pop.addEventListener("click", (e) => {
        const b = e.target.closest(".pw");
        if (b) fromHex(b.dataset.c);
      });
      if (window.EyeDropper)
        $("#pop-eye").onclick = () =>
          new EyeDropper()
            .open()
            .then((r) => normHex(r.sRGBHex) && fromHex(normHex(r.sRGBHex)))
            .catch(() => {});
      else $("#pop-eye").hidden = true;

      document.addEventListener("click", (e) => {
        const sw = e.target.closest(".cf-sw");
        if (!sw) return;
        const el = sw.closest("[data-cf]");
        !pop.hidden && cur === el ? closePop() : openPop(el);
      });
      document.addEventListener("pointerdown", (e) => {
        if (
          !pop.hidden &&
          !pop.contains(e.target) &&
          !e.target.closest(".cf-sw")
        )
          closePop();
      });
      document.addEventListener(
        "keydown",
        (e) => e.key === "Escape" && closePop(),
      );
      $("#left").addEventListener("scroll", closePop);
      addEventListener("resize", closePop);
      document.addEventListener("focusout", (e) => {
        const el = e.target.closest?.("[data-cf]");
        if (el && e.target.classList.contains("cf-hex")) cfRefresh(el);
      });

      // lista przystanków gradientu: kolor + pozycja + usuń
      function renderStops() {
        if (cur && cur.dataset.cf.startsWith("s:")) closePop();
        const many = state.stops.length > 2;
        $("#stops").innerHTML =
          state.stops
            .map(
              (s, i) => `<div class="flex items-center gap-2">
      <div data-cf="s:${i}" class="flex items-center gap-2"></div>
      <input type="range" class="flex-1 min-w-0" data-sp="${i}" min="0" max="100" value="${s.p}" aria-label="Pozycja koloru">
      <span class="w-9 text-right font-mono text-slate-300">${s.p}%</span>
      <button type="button" data-sdel="${i}" ${many ? "" : "disabled"} class="w-6 h-6 rounded-md text-slate-400 hover:text-white hover:bg-red-600/70 disabled:opacity-30 disabled:pointer-events-none" aria-label="Usuń kolor">×</button>
    </div>`,
            )
            .join("") +
          (state.stops.length < MAX_STOPS
            ? `<button type="button" data-act="addstop" class="text-xs px-3 py-1.5 rounded-lg border border-dashed border-slate-600 text-slate-300 hover:border-indigo-500 hover:text-white">+ Dodaj kolor</button>`
            : "");
        $$("#stops [data-cf]").forEach(cfMount);
        render();
      }

      /* ---------- Start ---------- */
      $("#s-layout").innerHTML = SLIDERS.layout.map(sliderHTML).join("");
      $("#s-bg").innerHTML = SLIDERS.bg.map(sliderHTML).join("");
      $("#s-style").innerHTML = SLIDERS.style.map(sliderHTML).join("");
      SAMPLES.forEach(addSvg);
      $$("[data-cf]").forEach(cfMount);
      renderStops();
      renderLibrary();
      syncUI();
      draw();
    </script>
  </body>
</html>
